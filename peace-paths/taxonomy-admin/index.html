<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Peace Meter — Taxonomy Admin</title>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    body { font-family: 'Segoe UI', system-ui, sans-serif; background: #0a0a0f; color: #e0e0e0; padding: 2rem; }
    h1 { font-size: 1.5rem; margin-bottom: 0.5rem; color: #fff; }
    .subtitle { color: #888; font-size: 0.85rem; margin-bottom: 2rem; line-height: 1.6; }
    .subtitle code { background: #1a1a2e; padding: 0.15em 0.4em; border-radius: 4px; color: #a0a0ff; }

    .toolbar { display: flex; gap: 1rem; align-items: center; margin-bottom: 1.5rem; flex-wrap: wrap; }
    .toolbar button {
      padding: 0.5rem 1rem; border: 1px solid #333; background: #1a1a2e; color: #e0e0e0;
      border-radius: 6px; cursor: pointer; font-size: 0.85rem; transition: background 0.2s;
    }
    .toolbar button:hover { background: #2a2a4e; }
    .toolbar button.primary { background: #2a4a2a; border-color: #4a7a4a; }
    .toolbar button.primary:hover { background: #3a6a3a; }
    .toolbar button.danger { background: #4a1a1a; border-color: #7a3a3a; }
    .toolbar button.danger:hover { background: #6a2a2a; }
    .toolbar button:disabled { opacity: 0.4; cursor: not-allowed; }

    .status { margin-bottom: 1rem; padding: 0.75rem 1rem; border-radius: 6px; font-size: 0.85rem; display: none; }
    .status.info { display: block; background: #1a1a3e; border: 1px solid #2a2a6e; color: #a0a0ff; }
    .status.success { display: block; background: #1a2e1a; border: 1px solid #2a5a2a; color: #a0ffa0; }
    .status.error { display: block; background: #2e1a1a; border: 1px solid #5a2a2a; color: #ffa0a0; }

    .grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(380px, 1fr)); gap: 1rem; }

    .card {
      background: #12121a; border: 1px solid #2a2a3a; border-radius: 8px; padding: 1.25rem;
      position: relative; transition: border-color 0.2s;
    }
    .card:hover { border-color: #4a4a6a; }
    .card .header { display: flex; align-items: center; gap: 0.5rem; margin-bottom: 0.75rem; }
    .card .icon { font-size: 1.5rem; cursor: pointer; width: 36px; text-align: center; }
    .card .icon:hover { transform: scale(1.2); }
    .card .name-input {
      background: transparent; border: 1px solid transparent; color: #fff; font-size: 1rem;
      font-weight: 600; padding: 0.25rem 0.5rem; border-radius: 4px; flex: 1;
    }
    .card .name-input:hover, .card .name-input:focus { border-color: #4a4a6a; background: #1a1a2a; }
    .card .id-tag {
      font-size: 0.7rem; color: #6a6a9a; background: #1a1a2e; padding: 0.15em 0.5em;
      border-radius: 3px; font-family: monospace;
    }

    .card label { display: block; font-size: 0.7rem; color: #6a6a8a; margin: 0.5rem 0 0.25rem; text-transform: uppercase; letter-spacing: 0.05em; }
    .card input, .card textarea {
      width: 100%; background: #0a0a14; border: 1px solid #2a2a3a; color: #c0c0d0;
      padding: 0.4rem 0.6rem; border-radius: 4px; font-size: 0.85rem; font-family: inherit;
    }
    .card textarea { resize: vertical; min-height: 48px; }
    .card input:focus, .card textarea:focus { border-color: #5a5a8a; outline: none; }

    .phases-container { margin-top: 0.5rem; }
    .phase-row { display: flex; align-items: center; gap: 0.5rem; margin-bottom: 0.25rem; }
    .phase-row span { color: #4a4a6a; font-size: 0.75rem; min-width: 18px; }
    .phase-row input { font-size: 0.8rem; }
    .remove-phase { color: #6a2a2a; cursor: pointer; font-size: 0.9rem; padding: 0 0.25rem; }
    .remove-phase:hover { color: #ff4a4a; }

    .card-actions { display: flex; gap: 0.5rem; margin-top: 0.75rem; justify-content: flex-end; }
    .card-actions button {
      padding: 0.3rem 0.6rem; border: 1px solid #333; background: #1a1a2e; color: #aaa;
      border-radius: 4px; cursor: pointer; font-size: 0.75rem;
    }
    .card-actions button:hover { color: #fff; background: #2a2a4e; }
    .card-actions button.del { background: #2e1a1a; border-color: #4a2a2a; color: #ff8a8a; }
    .card-actions button.del:hover { background: #4a2a2a; }

    .count-badge {
      position: absolute; top: 0.75rem; right: 1rem;
      background: #1a1a3e; color: #8a8aff; font-size: 0.75rem;
      padding: 0.2em 0.6em; border-radius: 10px;
    }

    .new-category-card {
      background: #0a0a14; border: 2px dashed #2a2a4a; border-radius: 8px; padding: 1.25rem;
      display: none;
    }
    .new-category-card.visible { display: block; }

    .deploy-banner {
      margin-top: 2rem; padding: 1.5rem; background: #1a1a2e; border: 1px solid #3a3a5e;
      border-radius: 8px; text-align: center;
    }
    .deploy-banner h3 { color: #fff; margin-bottom: 0.5rem; }
    .deploy-banner p { color: #8a8aaa; font-size: 0.85rem; margin-bottom: 1rem; line-height: 1.5; }
    .deploy-banner .btn-row { display: flex; gap: 1rem; justify-content: center; }
    .deploy-banner button {
      padding: 0.75rem 2rem; border-radius: 6px; font-size: 1rem; cursor: pointer; border: none; font-weight: 600;
    }
    .deploy-banner .btn-save { background: #2a5a2a; color: #fff; }
    .deploy-banner .btn-save:hover { background: #3a7a3a; }
    .deploy-banner .btn-deploy { background: #2a2a5a; color: #fff; }
    .deploy-banner .btn-deploy:hover { background: #3a3a7a; }

    .spinner {
      display: inline-block; width: 16px; height: 16px; border: 2px solid #555;
      border-top-color: #a0a0ff; border-radius: 50%; animation: spin 0.8s linear infinite;
    }
    @keyframes spin { to { transform: rotate(360deg); } }
  </style>
</head>
<body>

<h1>Taxonomy Admin</h1>
<p class="subtitle">
  Manage the AI classification categories for Peace Meter.<br>
  Workflow: <code>Review categories</code> &rarr; <code>Edit / Add / Delete</code> &rarr; <code>Save to taxonomy.json</code> &rarr; <code>Deploy</code>
</p>

<div id="status" class="status"></div>

<div class="toolbar">
  <button onclick="loadTaxonomy()">📂 Load taxonomy.json</button>
  <button onclick="loadDefault()">📋 Load Default</button>
  <button onclick="showNewCategory()">➕ Add Category</button>
  <button onclick="loadArticles()" id="btnArticles">📰 Load Articles (for review)</button>
</div>

<div class="grid" id="grid"></div>

<div class="deploy-banner" id="deployBanner" style="display:none;">
  <h3>Deploy Changes</h3>
  <p id="deployInfo">Save taxonomy first, then deploy. This re-classifies all articles with the new categories.</p>
  <div class="btn-row">
    <button class="btn-save" onclick="saveTaxonomy()">💾 Save taxonomy.json</button>
    <button class="btn-deploy" onclick="deploy()" id="btnDeploy">🚀 Deploy (AI re-classify + upload)</button>
  </div>
</div>

<script>
const DEFAULT_CATEGORIES = [
  { id: "ceasefire", name: "Ceasefire & De-escalation", description: "Ceasefire negotiations, de-escalation efforts, truce agreements across all conflict zones", icon: "🕊", phases: ["Active Fighting","Ceasefire Talks","Draft Agreement","Signed","Holding"] },
  { id: "diplomacy", name: "Diplomacy & Regional Deals", description: "Diplomatic normalization, Abraham Accords expansion, peace deals, regional cooperation", icon: "🤝", phases: ["Isolated","Back-channel","Framework","New Partners","Regional Peace"] },
  { id: "governance", name: "Post-War Governance", description: "Post-war governance plans, Palestinian Authority reform, transitional authority, political frameworks", icon: "🏛", phases: ["No Framework","Proposals","Consensus","Interim Gov","Sustainable"] },
  { id: "infrastructure", name: "Infrastructure & Recovery", description: "Infrastructure reconstruction, power/water/hospitals rebuilding, recovery efforts", icon: "💧", phases: ["Destroyed","Emergency Repairs","Partial","Reconstruction","Full Recovery"] },
  { id: "iran", name: "Iran Nuclear & War", description: "Iran-US conflict, nuclear program, Strait of Hormuz, Iran peace negotiations", icon: "☣️", phases: ["War","Ceasefire Talks","Armistice","Nuclear Deal","Resolution"] },
  { id: "lebanon", name: "Lebanon & Hezbollah", description: "Lebanon conflict, Hezbollah-Israel hostilities, southern Lebanon situation", icon: "🇱🇧", phases: ["Active Fighting","De-escalation","Ceasefire","Withdrawal","Stable"] },
  { id: "gaza-crisis", name: "Gaza Humanitarian Crisis", description: "Gaza humanitarian crisis, displacement, medicine/food blockade, aid delivery, disease, civilian suffering", icon: "🏚", phases: ["Blockade","Aid Inflow","Recovery","Rebuilding","Stabilized"] },
  { id: "human-rights", name: "Human Rights & Intl Law", description: "Human rights violations, war crimes, flotilla activists, ICC/ICJ, international law, abuse allegations", icon: "⚖️", phases: ["Allegations","Investigations","Sanctions","Accountability","Reform"] },
  { id: "domestic-politics", name: "Israeli Domestic Politics", description: "Israeli internal politics, coalition dynamics, Knesset, party struggles, Netanyahu, Herzog, liberal center", icon: "🏛", phases: ["Fractured","Coalition Shift","Policy Change","Elections","Stability"] },
  { id: "west-bank", name: "West Bank & Settlements", description: "West Bank settler violence, occupation policies, East Jerusalem, Palestinian communities", icon: "🔥", phases: ["Escalation","Violence Spike","Mediation","Calming","Frozen Conflict"] },
  { id: "regional", name: "Regional Relations", description: "Regional diplomacy, Arab states positions, Jordan, Egypt, Syria, Türkiye, Morocco, UAE, China influence", icon: "🌍", phases: ["Tensions","Diplomatic Push","Accord","Integration","Cooperation"] },
];

let taxonomy = null;
let articleCounts = {};
let articles = [];

function setStatus(msg, type='info') {
  const el = document.getElementById('status');
  el.textContent = msg;
  el.className = 'status ' + type;
}

function renderCard(cat, index) {
  const count = articleCounts[cat.id] || 0;
  const phases = cat.phases || ["Emerged","Developing","Gaining Traction","Maturing","Resolved"];

  let phasesHTML = phases.map((p, pi) => `
    <div class="phase-row">
      <span>${pi + 1}.</span>
      <input value="${p}" data-cat="${index}" data-phase="${pi}">
      <span class="remove-phase" onclick="removePhase(${index}, ${pi})">&times;</span>
    </div>
  `).join('');

  return `
    <div class="card" data-index="${index}">
      <div class="count-badge">${count} articles</div>
      <div class="header">
        <span class="icon" onclick="pickIcon(${index})" title="Click to change icon">${cat.icon || '\U0001f4cc'}</span>
        <input class="name-input" value="${cat.name}" data-cat="${index}" data-field="name">
        <span class="id-tag">${cat.id}</span>
      </div>
      <label>ID</label>
      <input value="${cat.id}" data-cat="${index}" data-field="id">
      <label>Description</label>
      <textarea data-cat="${index}" data-field="description">${cat.description || ''}</textarea>
      <label>Phases (5 stages)</label>
      <div class="phases-container" data-cat-phases="${index}">
        ${phasesHTML}
        <button onclick="addPhase(${index})" style="font-size:0.7rem;color:#6a6a9a;background:none;border:none;cursor:pointer;padding:0.25rem 0;">+ Add phase</button>
      </div>
      <div class="card-actions">
        <button onclick="moveUp(${index})">↑</button>
        <button onclick="moveDown(${index})">↓</button>
        <button class="del" onclick="deleteCategory(${index})">🗑 Delete</button>
      </div>
    </div>
  `;
}

function renderAll() {
  const grid = document.getElementById('grid');
  grid.innerHTML = taxonomy.map((cat, i) => renderCard(cat, i)).join('') +
    '<div class="new-category-card" id="newCategoryCard"></div>';
  document.getElementById('deployBanner').style.display = taxonomy.length > 0 ? 'block' : 'none';
}

function syncField(index, field, value) {
  taxonomy[index][field] = value;
}

document.addEventListener('input', (e) => {
  const { cat, field } = e.target.dataset || {};
  if (cat !== undefined && field) {
    syncField(parseInt(cat), field, e.target.value);
  }
});

function pickIcon(index) {
  const icons = ['🕊','🏚','🤝','🏛','💧','☣️','🇱🇧','⚖️','🔥','🌍','📌','🇵🇸','🇮🇷','🇮🇱','🇱🇧','🇸🇾','🇦🇪','🇶🇦','🇯🇴','🇪🇬','💻','✊','🕌','📿'];
  const current = taxonomy[index].icon || '📌';
  const idx = icons.indexOf(current);
  const next = icons[(idx + 1) % icons.length];
  taxonomy[index].icon = next;
  renderAll();
}

function addPhase(index) {
  taxonomy[index].phases = taxonomy[index].phases || [];
  taxonomy[index].phases.push('New Phase');
  renderAll();
}

function removePhase(index, phaseIndex) {
  if (taxonomy[index].phases.length <= 2) {
    setStatus('Minimum 2 phases required', 'error');
    return;
  }
  taxonomy[index].phases.splice(phaseIndex, 1);
  renderAll();
}

function moveUp(index) {
  if (index <= 0) return;
  [taxonomy[index-1], taxonomy[index]] = [taxonomy[index], taxonomy[index-1]];
  renderAll();
}

function moveDown(index) {
  if (index >= taxonomy.length - 1) return;
  [taxonomy[index], taxonomy[index+1]] = [taxonomy[index+1], taxonomy[index]];
  renderAll();
}

function deleteCategory(index) {
  const cat = taxonomy[index];
  const count = articleCounts[cat.id] || 0;
  const msg = count > 0
    ? `Delete "${cat.name}"? ${count} articles assigned to it will need re-classification on deploy.`
    : `Delete "${cat.name}"?`;
  if (!confirm(msg)) return;
  taxonomy.splice(index, 1);
  delete articleCounts[cat.id];
  renderAll();
  setStatus(`Removed "${cat.name}"`, 'info');
}

function showNewCategory() {
  const card = document.getElementById('newCategoryCard');
  card.classList.add('visible');
  card.innerHTML = `
    <h3 style="color:#fff;margin-bottom:1rem;">New Category</h3>
    <label>ID (lowercase-hyphen)</label>
    <input id="newId" placeholder="e.g. cyber-security">
    <label>Name</label>
    <input id="newName" placeholder="e.g. Cyber Security">
    <label>Description</label>
    <textarea id="newDesc" placeholder="Brief description for AI classifier..."></textarea>
    <label>Icon</label>
    <select id="newIcon" style="background:#0a0a14;border:1px solid #2a2a3a;color:#c0c0d0;padding:0.4rem;border-radius:4px;">
      ${['🕊','🏚','🤝','🏛','💧','☣️','🇱🇧','⚖️','🔥','🌍','📌','🇵🇸','🇮🇷','🇮🇱','💻','✊','🕌','📿'].map(i => `<option value="${i}">${i}</option>`).join('')}
    </select>
    <div style="display:flex;gap:0.5rem;margin-top:1rem;justify-content:flex-end;">
      <button onclick="document.getElementById('newCategoryCard').classList.remove('visible')" style="padding:0.5rem 1rem;background:#1a1a2e;color:#aaa;border:1px solid #333;border-radius:4px;cursor:pointer;">Cancel</button>
      <button onclick="addNewCategory()" style="padding:0.5rem 1rem;background:#2a4a2a;color:#fff;border:none;border-radius:4px;cursor:pointer;">Add</button>
    </div>
  `;
}

function addNewCategory() {
  const id = document.getElementById('newId').value.trim().toLowerCase().replace(/\s+/g, '-');
  const name = document.getElementById('newName').value.trim();
  const desc = document.getElementById('newDesc').value.trim();
  const icon = document.getElementById('newIcon').value;
  if (!id || !name) { setStatus('ID and Name are required', 'error'); return; }
  if (taxonomy.some(c => c.id === id)) { setStatus(`ID "${id}" already exists`, 'error'); return; }
  taxonomy.push({ id, name, description: desc || `${name} news and updates`, icon, phases: ["Emerged","Developing","Gaining Traction","Maturing","Resolved"] });
  document.getElementById('newCategoryCard').classList.remove('visible');
  renderAll();
  setStatus(`Added "${name}"`, 'success');
}

function loadTaxonomy() {
  fetch('./taxonomy.json')
    .then(r => { if (!r.ok) throw new Error('HTTP '+r.status); return r.json(); })
    .then(data => {
      taxonomy = data.categories.map(c => ({
        ...c, phases: c.phases || ["Emerged","Developing","Gaining Traction","Maturing","Resolved"]
      }));
      articleCounts = buildCounts(data.assignments || {});
      renderAll();
      setStatus(`Loaded ${taxonomy.length} categories from taxonomy.json`, 'success');
    })
    .catch(e => setStatus('Failed to load taxonomy.json: '+e.message, 'error'));
}

function loadDefault() {
  taxonomy = JSON.parse(JSON.stringify(DEFAULT_CATEGORIES));
  articleCounts = {};
  renderAll();
  setStatus(`Loaded ${taxonomy.length} default categories`, 'success');
}

function buildCounts(assignments) {
  const counts = {};
  for (const [, catId] of Object.entries(assignments)) {
    counts[catId] = (counts[catId] || 0) + 1;
  }
  return counts;
}

function loadArticles() {
  const btn = document.getElementById('btnArticles');
  btn.disabled = true;
  btn.innerHTML = '<span class="spinner"></span> Fetching...';
  setStatus('Fetching RSS feeds to count articles per category...', 'info');

  // Call the taxonomy admin API endpoint
  fetch('./api/articles', { method: 'POST' })
    .then(r => r.json())
    .then(data => {
      articles = data.articles || [];
      articleCounts = buildCounts(data.assignments || {});
      renderAll();
      setStatus(`Loaded ${articles.length} articles. Article counts shown per category.`, 'success');
      btn.innerHTML = '📰 Refresh Articles';
      btn.disabled = false;
    })
    .catch(e => {
      setStatus('Failed to fetch articles: '+e.message, 'error');
      btn.innerHTML = '📰 Load Articles (for review)';
      btn.disabled = false;
    });
}

function saveTaxonomy() {
  const data = {
    categories: taxonomy.map(c => ({ id: c.id, name: c.name, description: c.description, icon: c.icon, phases: c.phases })),
    assignments: {}
  };

  // Write via API endpoint (since taxonomy.json is on the server)
  fetch('./api/save', {
    method: 'POST',
    headers: { 'Content-Type': 'application/json' },
    body: JSON.stringify(data)
  })
  .then(r => r.json())
  .then(result => {
    if (result.ok) {
      setStatus(`Saved ${taxonomy.length} categories to taxonomy.json`, 'success');
    } else {
      setStatus('Save failed: ' + (result.error || 'unknown'), 'error');
    }
  })
  .catch(e => {
    // Fallback: download as file
    const blob = new Blob([JSON.stringify(data, null, 2)], { type: 'application/json' });
    const a = document.createElement('a');
    a.href = URL.createObjectURL(blob);
    a.download = 'taxonomy.json';
    a.click();
    setStatus('Saved taxonomy.json as download (server API unavailable)', 'info');
  });
}

async function deploy() {
  const btn = document.getElementById('btnDeploy');
  btn.disabled = true;
  btn.innerHTML = '<span class="spinner"></span> Deploying...';

  // Step 1: Save taxonomy
  await fetch('./api/save', {
    method: 'POST',
    headers: { 'Content-Type': 'application/json' },
    body: JSON.stringify({ categories: taxonomy.map(c => ({ id: c.id, name: c.name, description: c.description, icon: c.icon, phases: c.phases })) })
  });

  setStatus('Running AI classification with new taxonomy (this may take 1-3 minutes)...', 'info');

  try {
    const resp = await fetch('./api/deploy', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ mode: 'daily' })
    });
    const result = await resp.json();

    if (result.ok) {
      setStatus(`Deployed! ${result.articles} articles classified into ${result.categories} categories.`, 'success');
    } else {
      setStatus('Deploy failed: ' + (result.error || 'unknown'), 'error');
    }
  } catch (e) {
    setStatus('Deploy unavailable (server API not running). Run locally:\n\n  python ai-analyze-prod.py --use-taxonomy taxonomy.json --daily\n\nThen deploy with wrangler.', 'error');
  }

  btn.disabled = false;
  btn.innerHTML = '🚀 Deploy (AI re-classify + upload)';
}

// Auto-load on startup
window.addEventListener('DOMContentLoaded', () => {
  // Try loading taxonomy.json, fall back to default
  fetch('./taxonomy.json')
    .then(r => r.json())
    .then(data => {
      taxonomy = data.categories.map(c => ({ ...c, phases: c.phases || ["Emerged","Developing","Gaining Traction","Maturing","Resolved"] }));
      articleCounts = buildCounts(data.assignments || {});
      renderAll();
      setStatus(`Loaded ${taxonomy.length} categories from taxonomy.json`, 'success');
    })
    .catch(() => {
      taxonomy = JSON.parse(JSON.stringify(DEFAULT_CATEGORIES));
      articleCounts = {};
      renderAll();
      setStatus('No taxonomy.json found. Showing defaults.', 'info');
    });
});
</script>

</body>
</html>
